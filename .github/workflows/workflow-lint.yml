name: "Check the workflow files"

# The workflow files are the CI. A mistake in one costs a run: the error
# appears only after the push, and the rest of the file never runs.
# actionlint reads the workflow syntax, the expression syntax and the shell
# scripts the files run. zizmor reads the same files for security problems:
# an action that is not pinned to a hash, a credential left on disk, a
# template expanded into a shell command.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Check the workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The official actionlint image, pinned to one release.
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # zizmor reads the same files for security problems. The policy in
      # `.github/zizmor.yml` records the two findings this repository keeps on
      # purpose, and the version is pinned so the scan does not change under
      # the repository.
      - uses: zizmorcore/zizmor-action@8aaeb6d158204e73d77eb4b50bcb325641de1bd4
        with:
          version: 1.30.1
          min-severity: medium
          advanced-security: false
          annotations: true
