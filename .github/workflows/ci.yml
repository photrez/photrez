name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── RUST: one workspace, three OSes, the full crate set ───
  # The root workspace owns every crate:
  # `cargo test --workspace` is the whole Rust suite. gpui builds on all three
  # runners; Linux needs the X11/wayland/fontconfig/Vulkan stack named below.
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The first cold run builds the ~850-crate gpui tree (Windows) and compiles
    # `cargo-deny` from source (Ubuntu).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pinned-toolchain

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev

      # Saved only on main: a pull request restores the closest main cache but
      # saves none, so it cannot push the main cache out of the limit. The input
      # name is `save-if`; `cache-save-if` belongs to the other rust-cache action.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target
          save-if: github.ref == 'refs/heads/main'

      - name: Core tests
        run: cargo test -p photrez-core

      # The document model builds and tests without the engine, so a model
      # change reports on its own rather than through the core suite.
      - name: Document model tests
        run: cargo test -p photrez-document

      # The raster primitives hold no document state, so their kernel, tile and
      # copy-on-write checks run without the engine too.
      - name: Raster tests
        run: cargo test -p photrez-raster

      # The `.ptz` golden, envelope round trip, and codec checks belong to the
      # format package, so a saved-file change reports on the package that owns
      # the bytes.
      - name: PTZ format package tests
        run: cargo test -p photrez-format

      # Compositing and the shape and text rasterizers read pixels through
      # `RenderInput`, so their golden proofs run without the engine.
      - name: Render tests
        run: cargo test -p photrez-render

      # Lint gate: `-D warnings` keeps new code clippy-clean; fmt --check
      # keeps the tree rustfmt-stable (run `cargo fmt` locally when this fails).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The input-latency driver compiles only behind this feature, so the
      # plain clippy step above never lints it on any OS. Lint it explicitly.
      - name: Clippy (measurement driver feature)
        run: cargo clippy -p photrez --all-targets --features input-measurement -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.152

      - name: Tests (workspace)
        # nextest isolates each test in its own process and keeps going after a
        # failure (`.config/nextest.toml`, profile ci). It does not run doctests.
        run: cargo nextest run --workspace --profile ci

      - name: Doc tests
        run: cargo test --doc --workspace

      # The shipped executable. The workspace tests build test harnesses, so a
      # link failure in the app binary would only appear in the release
      # workflow, after the tag. The release build also compiles the HLSL
      # shaders, which the debug profile skips.
      - name: Build the app
        run: cargo build -p photrez

      - name: Docs (deny warnings)
        # `VAR=value command` is shell syntax; the Windows runner's default
        # shell is PowerShell, where it reads as a command name and the gate
        # dies before cargo runs.
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked

      # Licences, advisories, sources, and the workspace package graph
      # (`bans.deny` wrappers in deny.toml).
      - name: Licence and advisory policy
        if: runner.os == 'Linux'
        run: cargo deny check

  # ─── TYPOS: the English prose spells its words ───
  # The message catalogs are excluded in typos.toml: they are Indonesian, and
  # a checker that expects English flags every translated word.
  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@aa7e5314d3f3fc71e2522f80fca1e6ffcc3ce7db

  # ─── SECURITY: dependency audit (informational, non-blocking) ───
  # For a small OSS project the audit runs as a warning, not a hard gate: a
  # transitive RUSTSEC advisory shouldn't paint every push red. Eight entries
  # are dispositioned in deny.toml, each naming the path that pulls it in: the
  # zbus stack via accesskit_unix inside the pinned gpui-pre 0.3.9, three pinned
  # by the framework tree, and two from the font and vector-graphics stack. All
  # are informational unmaintained notices with no patched release, and
  # `cargo deny check advisories` blocks on anything outside that list. This step
  # reads a different database, so it can report more entries than deny blocks;
  # that difference is why it warns. Fixes still land via Dependabot PRs.
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pinned-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        continue-on-error: true
        run: cargo audit

  # ─── I18N: literal catalog keys resolve in every locale ───
  i18n:
    name: Message catalog coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev

      - uses: ./.github/actions/pinned-toolchain

      - name: Message catalog coverage (literal lookups)
        shell: bash
        run: cargo test -p photrez i18n::tests::every_literal_lookup_resolves --lib




