name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── FRONTEND: unit tests (node) ───
  # Narrowed 2026-10-17 alongside the browser build pipeline: type-check, lint,
  # build and e2e all exercised the bundled browser engine this tree no longer
  # builds; the multi-OS matrix existed for e2e's per-platform rendering. What
  # remains is the OS-independent unit suite.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests (node — fast)
        run: bun run --filter photrez-desktop test:unit

  # ─── RUST: one workspace, three OSes ───
  # After the workspace consolidation the root workspace owns every crate:
  # `cargo test --workspace` is the whole Rust suite. The frozen Tauri app
  # (`apps/desktop/src-tauri`) is an excluded non-member and is not built or
  # tested here. gpui has only ever been proven on Windows, so ubuntu/macos
  # gate everything except the `photrez` UI crate; enabling gpui on those
  # runners belongs to the packaging plan.
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # 60: the first cold run includes the ~850-crate gpui build (Windows) and
    # a `cargo install cargo-deny` compile (Ubuntu).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Core tests
        run: cargo test -p photrez-core

      # Lint gate: `-D warnings` keeps new code clippy-clean; fmt --check
      # keeps the tree rustfmt-stable (run `cargo fmt` locally when this fails).
      # gpui is only proven on Windows, so the non-Windows runners exclude the
      # `photrez` UI crate until the packaging plan enables it there.
      - name: Clippy (deny warnings)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (deny warnings, without the gpui UI crate)
        if: runner.os != 'Windows'
        run: cargo clippy --workspace --exclude photrez --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Tests (workspace)
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Docs (deny warnings)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
          else
            RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace --exclude photrez
          fi

      - name: Install cargo-deny
        if: runner.os == 'Ubuntu'
        run: cargo install cargo-deny --locked

      - name: Licence and advisory policy
        if: runner.os == 'Ubuntu'
        run: cargo deny check

      - name: File-size ratchet
        shell: bash
        run: sh scripts/check-rust-file-size.sh

  # ─── SECURITY: dependency audit (informational, non-blocking) ───
  # For a small OSS project the audit runs as a warning, not a hard gate: a
  # transitive RUSTSEC advisory shouldn't paint every push red. Fixes still
  # land via Dependabot PRs.
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bun audit (high/critical)
        # Ignored advisories (pre-existing, transitive-only; last reviewed 2026-10-15):
        #   GHSA-r28c-9q8g-f849, GHSA-2pvr-wf23-7pc7, GHSA-8hv8-536x-4wqp
        #   GHSA-vfj7-8cjw-p6xm (braces), GHSA-ch52-4w7c-c8xp (http-cache-semantics)
        #   Both have NO patched version published — braces' latest is 3.0.3 and
        #   http-cache-semantics' latest is 4.2.0, which are the vulnerable ones.
        # Remove the --ignore flags once a patched version is published or the
        # offending dependency is dropped from the lockfile. Keep this list and
        # the one in .husky/pre-push identical.
        run: bun audit --prod --audit-level=high --ignore GHSA-r28c-9q8g-f849 --ignore GHSA-2pvr-wf23-7pc7 --ignore GHSA-8hv8-536x-4wqp --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-ch52-4w7c-c8xp

  # ─── COMPONENT TESTS: cannot run in this tree (removed 2026-10-17) ───
  # The jsdom component suite boots the bundled browser engine, which this
  # tree no longer builds; it returns when a native component harness exists.

  # ─── CONTRIBUTIONS: public-artifact terminology guard ───
  # Machine-enforced rule: public artifacts (commit/PR messages and source) must
  # NEVER leak internal plan/milestone terminology that lives in gitignored docs
  # (e.g. "Phase E pilot", "Option A", "flip-on"). Same logic as the local
  # pre-commit hook, driven from one shared script (scripts/check-public-terminology.sh)
  # so it cannot diverge between local and CI. PR titles are additionally
  # validated against Conventional Commits by .github/workflows/lint-pr.yml.
  contributions:
    name: Public-artifact terminology guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan changed source and public markdown for internal terminology
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          # `|| true`: with no changed files the filter exits 1, which
          # bash -o pipefail turns into a failed step before the skip branch
          # below can run. Docs-only and config-only commits must pass.
          # The script itself decides which `.md` paths are public set vs internal.
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(ts|tsx|rs|md)$' | tr '\n' ' ' || true)
          if [ -n "$FILES" ]; then
            sh scripts/check-public-terminology.sh --files "$FILES"
          else
            echo "No changed source files matched; terminology scan skipped."
          fi

      - name: Reject hardcoded UI strings in the ported views tree
        shell: bash
        run: sh scripts/check-public-terminology.sh --i18n --files crates/photrez/src/views crates/photrez/src/components

      - name: Scan public stack surfaces for staleness
        shell: bash
        run: sh scripts/check-public-terminology.sh --staleness

      - name: Check PR title for internal terminology
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/check-public-terminology.sh --msg "$PR_TITLE"
