name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── RUST: one workspace, three OSes, the full crate set ───
  # After the workspace consolidation the root workspace owns every crate:
  # `cargo test --workspace` is the whole Rust suite. gpui builds on all three
  # runners; Linux needs the X11/wayland/fontconfig/Vulkan stack named below.
  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The first cold run builds the ~850-crate gpui tree (Windows) and compiles
    # `cargo-deny` from source (Ubuntu).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pinned-toolchain

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Core tests
        run: cargo test -p photrez-core

      # The document model builds and tests without the engine, so a model
      # change reports on its own rather than through the core suite.
      - name: Document model tests
        run: cargo test -p photrez-document

      # The raster primitives hold no document state, so their kernel, tile and
      # copy-on-write checks run without the engine too.
      - name: Raster tests
        run: cargo test -p photrez-raster

      # The `.ptz` golden, envelope round trip, and codec checks belong to the
      # format package, so a saved-file change reports on the package that owns
      # the bytes.
      - name: PTZ format package tests
        run: cargo test -p photrez-format

      # Compositing and the shape and text rasterizers read pixels through
      # `RenderInput`, so their golden proofs run without the engine.
      - name: Render tests
        run: cargo test -p photrez-render

      # Lint gate: `-D warnings` keeps new code clippy-clean; fmt --check
      # keeps the tree rustfmt-stable (run `cargo fmt` locally when this fails).
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The input-latency driver compiles only behind this feature, so the
      # plain clippy step above never lints it on any OS. Lint it explicitly.
      - name: Clippy (measurement driver feature)
        run: cargo clippy -p photrez --all-targets --features input-measurement -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Tests (workspace)
        run: cargo test --workspace

      - name: Docs (deny warnings)
        # `VAR=value command` is shell syntax; the Windows runner's default
        # shell is PowerShell, where it reads as a command name and the gate
        # dies before cargo runs.
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked

      - name: Licence and advisory policy
        if: runner.os == 'Linux'
        run: cargo deny check

      - name: File-size ratchet
        shell: bash
        run: sh scripts/check-rust-file-size.sh

      # Each package keeps one function. An edge outside the allowed graph means
      # a type was left in the wrong package, which no test would catch.
      - name: Package boundaries
        shell: bash
        run: sh scripts/check-package-boundaries.sh

  # ─── SECURITY: dependency audit (informational, non-blocking) ───
  # For a small OSS project the audit runs as a warning, not a hard gate: a
  # transitive RUSTSEC advisory shouldn't paint every push red. Eight entries
  # are dispositioned in deny.toml, each naming the path that pulls it in: the
  # zbus stack via accesskit_unix inside the pinned gpui-pre 0.3.9, three pinned
  # by the framework tree, and two from the font and vector-graphics stack. All
  # are informational unmaintained notices with no patched release, and
  # `cargo deny check advisories` blocks on anything outside that list. This step
  # reads a different database, so it can report more entries than deny blocks;
  # that difference is why it warns. Fixes still land via Dependabot PRs.
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pinned-toolchain

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

  # ─── CONTRIBUTIONS: public surface guard ───
  # Machine-enforced rule: public source and docs must not link to files a
  # fresh clone cannot contain, or claim a runtime the project no longer ships.
  # User-visible text uses the message catalog. The same public checks run in
  # the local pre-commit hook (scripts/check-public-terminology.sh).
  # PR titles are validated against Conventional Commits by
  # .github/workflows/lint-pr.yml.
  contributions:
    name: Public surface guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan changed source and public markdown for public-surface violations
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          # `|| true`: with no changed files the filter exits 1, which
          # bash -o pipefail turns into a failed step before the skip branch
          # below can run. Docs-only and config-only commits must pass.
          # Only the tracked public set is scanned.
          FILES=$(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD" | grep -E '\.(rs|md)$' | tr '\n' ' ' || true)
          if [ -n "$FILES" ]; then
            sh scripts/check-public-terminology.sh --files "$FILES"
          else
            echo "No changed source files matched; terminology scan skipped."
          fi

      - name: Reject hardcoded UI strings in views and components
        shell: bash
        run: sh scripts/check-public-terminology.sh --i18n --files crates/photrez/src/views crates/photrez/src/components

      - name: Scan public stack surfaces for staleness
        shell: bash
        run: sh scripts/check-public-terminology.sh --staleness
