# Automated releases for Photrez.
# Triggered by pushing a version tag (e.g. v0.2.0). Builds the native app on
# all three platforms with plain `cargo build --release`, packages a per-OS
# archive (LICENSE, NOTICE, THIRD_PARTY.md included), and attaches the
# archives to the GitHub Release draft created from the tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: Photrez-${{ github.ref_name }}-windows-x64.zip
          - os: macos-latest
            platform: macos
            archive: Photrez-${{ github.ref_name }}-macos-arm64.tar.gz
          - os: ubuntu-latest
            platform: linux
            archive: Photrez-${{ github.ref_name }}-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/pinned-toolchain

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # GPUI's Linux stack: X11/wayland client libs, fontconfig, and the
          # Vulkan loader (blade renders through Vulkan).
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev patchelf

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the app
        run: cargo build --release -p photrez

      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/photrez.exe dist/
          Copy-Item LICENSE, NOTICE, THIRD_PARTY.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Package (macos / linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/photrez dist/
          cp LICENSE NOTICE THIRD_PARTY.md dist/
          tar -czf "${{ matrix.archive }}" -C dist .

      # Smoke test: the archive must be a real build (size floor) and must carry
      # the licence set plus the binary. The rule lives in one script so a
      # developer can prove it fails locally before a runner ever does.
      - name: Verify release artifacts (smoke test)
        shell: bash
        run: sh scripts/check-release-archive.sh "${{ matrix.archive }}" "${{ matrix.platform }}"

      - name: Upload the archive to the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ matrix.archive }}

  # Finalize the draft release once every platform job has attached its
  # archive: generate SHA-256 checksums (Photrez is not code-signed, so
  # checksums are the only integrity verification users can do) and replace
  # the placeholder body with CHANGELOG.md.
  finalize:
    name: Attach checksums & release notes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" --dir assets

      - name: Generate SHA256SUMS
        working-directory: assets
        run: sha256sum * > SHA256SUMS

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" assets/SHA256SUMS --clobber

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --notes-file CHANGELOG.md
