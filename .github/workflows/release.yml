# Automated releases for Photrez.
# Triggered by pushing a version tag (e.g. v0.2.0). Builds the native app on
# all three platforms with plain `cargo build --release`, packages a per-OS
# archive (LICENSE, NOTICE, THIRD_PARTY.md included), and attaches the
# archives to the GitHub Release draft created from the tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing derived the release tag from the package version, so a tag of v0.3.0
  # on a 0.2.0 manifest would have built and published anyway. `cargo pkgid` is
  # used rather than the manifest text so the value comes from cargo itself.
  check-tag:
    name: Tag matches the manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compare the tag with the package version
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          got="$(cargo pkgid -p photrez | sed 's/.*#//')"
          if [ "$want" != "$got" ]; then
            echo "tag ${GITHUB_REF_NAME} asks for $want, the package version is $got"
            exit 1
          fi
          echo "version: $got"

  release:
    name: Build & package (${{ matrix.os }})
    needs: check-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: Photrez-${{ github.ref_name }}-windows-x64.zip
          - os: macos-latest
            platform: macos
            archive: Photrez-${{ github.ref_name }}-macos-arm64.tar.gz
          - os: ubuntu-latest
            platform: linux
            archive: Photrez-${{ github.ref_name }}-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/pinned-toolchain

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # GPUI's Linux stack: X11/wayland client libs, fontconfig, and the
          # Vulkan loader (blade renders through Vulkan).
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libfontconfig1-dev libfreetype6-dev \
            libvulkan-dev patchelf

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the app
        run: cargo build --release -p photrez

      - name: Package (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/photrez.exe dist/
          Copy-Item LICENSE, NOTICE, THIRD_PARTY.md dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}"

      - name: Package (macos / linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/photrez dist/
          cp LICENSE NOTICE THIRD_PARTY.md dist/
          tar -czf "${{ matrix.archive }}" -C dist .

      # Smoke test: the archive must be a real build (size floor) and must carry
      # the licence set plus the binary. The rule lives in one script so a
      # developer can prove it fails locally before a runner ever does.
      - name: Verify release artifacts (smoke test)
        shell: bash
        run: sh scripts/check-release-archive.sh "${{ matrix.archive }}" "${{ matrix.platform }}"

      - name: Upload the archive to the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: false
          files: ${{ matrix.archive }}

  # Finalize the draft release once every platform job has attached its
  # archive: generate SHA-256 checksums (Photrez is not code-signed, so
  # checksums are the only integrity verification users can do) and replace
  # the placeholder body with CHANGELOG.md.
  finalize:
    name: Attach checksums & release notes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "${{ github.ref_name }}" --dir assets

      - name: Generate SHA256SUMS
        working-directory: assets
        # `sha256sum * > SHA256SUMS` hashed the file it was about to write,
        # because the redirect creates it first. The list is built in its own
        # loop, which also drops a SHA256SUMS left over from an earlier run of
        # this job, so the file never records itself. An empty download fails
        # with a reason.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=()
          for asset in *; do
            if [ "$asset" != "SHA256SUMS" ]; then
              files+=("$asset")
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "the release has no assets to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" assets/SHA256SUMS --clobber

      - name: Verify published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Generating a checksum file says the build was measured; it does not say
        # the published asset still matches it. This downloads the release again
        # into a fresh directory and checks it, so what a user would fetch is what
        # gets verified, including SHA256SUMS itself being present. --strict makes
        # a listed file that cannot be read a failure rather than a warning.
        run: |
          set -euo pipefail
          rm -rf verify && mkdir -p verify
          gh release download "${{ github.ref_name }}" --dir verify
          if [ ! -f verify/SHA256SUMS ]; then
            echo "the release has no SHA256SUMS to verify"
            exit 1
          fi
          ( cd verify && sha256sum --strict --check SHA256SUMS )

      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Passing CHANGELOG.md whole would post every past release, and its
        # section header still reads "unreleased". Only this tag's section
        # belongs in the notes, and a tag with no section must not publish
        # without any. A section that still says "unreleased" describes an
        # entry nobody dated yet, so it names the line to fix instead of
        # publishing it as a release.
        run: |
          set -euo pipefail
          version="${{ github.ref_name }}"
          header="## [${version#v}]"
          awk -v hdr="$header" '
            index($0, hdr) == 1 { keep = 1 }
            keep && substr($0, 1, 4) == "## [" && index($0, hdr) != 1 { exit }
            keep { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $header"
            exit 1
          fi
          if grep -qi 'unreleased' release-notes.md; then
            echo "CHANGELOG.md: $header is not dated for this release; set it to '## [${version#v}] - YYYY-MM-DD'"
            grep -in 'unreleased' release-notes.md
            exit 1
          fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
