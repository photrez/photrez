name: Deploy Landing Page to photrez.github.io

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Landing Page
        run: bun run --filter photrez-landing build

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.PHOTREZ_DEPLOY_APP_ID }}
          private-key: ${{ secrets.PHOTREZ_DEPLOY_PRIVATE_KEY }}

      - name: Deploy to photrez.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ steps.app-token.outputs.token }}
          external_repository: photrez/photrez.github.io
          publish_branch: main
          publish_dir: ./apps/landing/dist
