rules:
  dangerous-triggers:
    ignore:
      # The pull request title lint runs on the base branch so the action can
      # read the title of a fork pull request. It checks out no pull request
      # code, so the trigger has nothing to execute.
      - lint-pr.yml
  cache-poisoning:
    ignore:
      # The release build keeps its own cache prefix, so a pull request run
      # cannot write the cache that the publishing job restores.
      - .github/workflows/release.yml
  # cargo-dist owns release.yml. Its generated actions and container images are
  # version-pinned by the tool, and the release workflow needs write access to
  # publish artifacts.
  # cargo-dist generates release.yml with symbolic action and image refs.
  # Keep the rule enabled elsewhere and suppress it for this generated file.
  unpinned-uses:
    disable: true
  overly-broad-permissions:
    ignore:
      - .github/workflows/release.yml
  template-injection:
    ignore:
      - .github/workflows/release.yml
