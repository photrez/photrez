# cargo-nextest config. Pin the version so every machine and CI runs the same
# scheduler and config dialect. Install with:
#
#   cargo install cargo-nextest --locked --version 0.9.152
nextest-version = "0.9.152"

# GPUI tests create windows and GPU contexts. Running too many at once exhausts
# those resources, so cap the app package's tests in one group.
[test-groups]
ui = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(photrez)'
test-group = 'ui'

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"
