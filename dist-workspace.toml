[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# AGPL-3.0 requires the licence and notices to accompany the conveyed copy.
include = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]

# GPUI's Linux stack: X11/Wayland client libraries, fontconfig and the Vulkan
# loader used by blade. These are build-time dependencies; binaries are static
# enough for the portable archive.
[dist.dependencies.apt]
libxkbcommon-dev = "*"
libxkbcommon-x11-dev = "*"
libwayland-dev = "*"
libx11-dev = "*"
libfontconfig1-dev = "*"
libfreetype6-dev = "*"
libvulkan-dev = "*"
patchelf = "*"
