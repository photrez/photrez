# Unify all build output into ONE root target dir. Cargo discovers this config
# from any subdirectory, so every workspace member shares it and a second
# (multi-GB) target tree can never be created under a member folder.
[build]
target-dir = "target"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-feature=+simd128",
    # webgpu_adjust.rs (Technique A / WebGpuAdjustRenderer) is gated behind
    # this cfg; without it the module compiles EMPTY and the export silently
    # disappears from the pkg (discovered 2026-08-21 - Technique A was inert).
    "--cfg", "web_sys_unstable_apis",
]
