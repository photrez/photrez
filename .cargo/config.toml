# Unify all build output into ONE root target dir. Cargo discovers this config
# from any subdirectory, so every workspace member shares it and a second
# (multi-GB) target tree can never be created under a member folder.
[build]
target-dir = "target"

# Shared-dependency reuse is enabled. Build intermediates live under
# `~/.cargo/targets/`; on this machine that path is a junction to a folder on
# the project drive, so C: does not grow while sharing stays on.

# GNU ld is the documented default linker for x86_64-pc-windows-gnu; rust-lld
# ships with the toolchain and links this workspace. `-Clinker-features=+lld`
# is still unstable, so name the bundled linker directly instead.
# revert: delete this table.
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"

# Workspace-wide entry points. `dev` relies on `default-run` in the photrez
# manifest to pick the app binary (the measurement binaries are not the dev
# loop). On a machine whose PATH lacks the gnu linker directory, use
# `cargo xtask dev` instead - it prepends the directory to the child PATH.
# Alias names must not collide with built-in commands (`check`, `test`, ...);
# the workspace tasks live under `cargo xtask` for that reason.
[alias]
dev = ["run", "-p", "photrez", "--features", "hot-reload"]
# UI iteration profile: same dev settings, app crate at opt-level 1.
ui = ["run", "--profile", "dev-ui", "-p", "photrez", "--features", "hot-reload"]
verify = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
# Environment probe: rustc, cargo, bacon and linker availability.
doctor = ["xtask", "doctor"]
# Standard xtask bootstrap: `cargo xtask <args>` runs the workspace task crate.
xtask = ["run", "--package", "xtask", "--"]

