# The build output lives in ONE place: the workspace root's `target/`. Cargo
# already puts it there for a virtual workspace, so no `build.target-dir` is
# set. Naming one would only earn a warning from the cargo fork that owns its
# own build directory (`~/.cargo/targets/<project>-<hash>/`) and mirrors the
# binaries into `./target` anyway.
#
# The default linker for x86_64-pc-windows-gnu is the gcc driver, which pulls
# the MinGW runtime DLLs in at link time. The bundled rust-lld avoids that;
# `-Clinker-features=+lld` is still unstable, so name the linker directly.
# gpui-pre's windres still needs the MinGW directory.
# revert: delete this table.
[target.x86_64-pc-windows-gnu]
linker = "rust-lld"

# Workspace-wide entry points. `dev` relies on `default-run` in the photrez
# manifest to pick the app binary (the measurement binaries are not the dev
# loop). On a machine whose PATH lacks the gnu linker directory, use
# `cargo xtask dev` instead - it prepends the directory to the child PATH.
# Alias names must not collide with built-in commands (`check`, `test`, ...);
# the workspace tasks live under `cargo xtask` for that reason.
[alias]
dev = ["run", "-p", "photrez"]
# UI iteration profile: same dev settings, app crate at opt-level 1.
ui = ["run", "--profile", "dev-ui", "-p", "photrez"]
verify = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
# Environment probe: rustc, cargo, bacon and linker availability.
doctor = ["xtask", "doctor"]
# Standard xtask bootstrap: `cargo xtask <args>` runs the workspace task crate.
xtask = ["run", "--package", "xtask", "--"]

