# `App::set_pointer_hidden` (gpui-fast 0.1.13) keeps the brush ring as the only
# pointer on macOS, X11, and Wayland. Patched crates live on photrez/gpui-fast
# branch release/0.1.13-photrez-pointer until crates.io publishes the API.
[patch.crates-io]
gpui-fast = { git = "https://github.com/photrez/gpui-fast", rev = "d5af71f0cfdbcf7fa1878d85cbf09569f8574c81" }
gpui-fast-linux = { git = "https://github.com/photrez/gpui-fast", rev = "d5af71f0cfdbcf7fa1878d85cbf09569f8574c81", package = "gpui-fast-linux" }

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
# We will define shared dependencies here as we proceed.

[workspace.package]
rust-version = "1.98.1"

# One dependency-free mechanism, one place: members opt in with
# `[lints] workspace = true`. `crates/core` opts in and contains no `unsafe`
# block. `crates/photrez` and `crates/xtask` wrap operating-system APIs, so
# they keep the denial at crate level and lift it only in the narrow modules
# that make the FFI calls, each with the reason written beside it.
# `unsafe_code` is denied outright for opt-ins, `dead_code` warns; the
# restriction lints that gate the crates (unwrap/expect/panic) are allowed at
# the root with a written reason: the core engine carries hundreds of
# unwrap/expect sites, so a blanket deny here would be decoration, not a gate.
[workspace.lints.rust]
unsafe_code = "deny"
dead_code = "warn"

[workspace.lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

# Native release profile. No package-scoped release overrides: every crate uses
# Cargo's default `release` tuning (opt-level = 3, LTO off).
#
# The measurement command runs the debug profile. Keep GPUI's paint/upload path
# optimised, and optimise the app crate too: the seam's full-buffer RGBA->BGRA
# loop is production code, and at rustc's default debug codegen it dominates the
# measurement. This is a profile override, not a behaviour change.
[profile.dev.package]
gpui-base = { opt-level = 2 }
gpui-component = { opt-level = 2 }
gpui-kit = { opt-level = 2 }
gpui-pre = { opt-level = 2 }
photrez = { opt-level = 2 }
photrez-core = { opt-level = 3 }
# The compositor, brush rasterizer, and codecs do the per-pixel work for every
# edit. At opt-level 0 a 12 MP composite takes about 1.2 s, so the dev build
# stalls on the UI thread. Keep the pixel crates at the core's level.
photrez-document = { opt-level = 3 }
photrez-format = { opt-level = 3 }
photrez-raster = { opt-level = 3 }
photrez-render = { opt-level = 3 }

# Dev builds need backtraces, not variable-level DWARF: full debug info was most
# of the 773 MB binary (292 MB with this setting). When a debugger needs
# variables again, override it for one build:
#   cargo build -p photrez --config "profile.dev.debug=2"
[profile.dev]
debug = "line-tables-only"

# UI iteration: the app crate dominates an incremental build at `dev`'s
# opt-level 2, while the GPUI stack keeps its tuned settings through `inherits`.
# Measurements stay on `dev`; this profile is for the edit/run loop only.
[profile.dev-ui]
inherits = "dev"

[profile.dev-ui.package]
photrez = { opt-level = 1 }

[profile.dev-fast]
inherits = "dev"
opt-level = 3
debug = "line-tables-only"




