[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/core"
]

[workspace.dependencies]
# We will define shared dependencies here as we proceed.

# Native release profile. No package-scoped overrides remain: every crate uses
# Cargo's default `release` tuning (opt-level = 3, LTO off). The size-targeted
# `opt-level = "s"` override that used to sit here applied only to the removed
# browser build, and keeping it would have silently slowed the native binary.
