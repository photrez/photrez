# cargo-deny configuration: licence and advisory policy for the dependency tree.
# Run from the repository root:
#
#   cargo deny check licenses
#
# Reference: https://embarkstudios.github.io/cargo-deny/

[licenses]
version = 2
# Minimum confidence for licence detection from licence files; an SPDX
# expression in the crate manifest always wins over detection.
confidence-threshold = 0.93
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
yanked = "warn"
# Known, upstream-pinned advisories with no safe upgrade available. Every entry
# below was read from the RustSec advisory record and is `informational =
# "unmaintained"`: no vulnerability, no unsoundness, no patched release exists.
# Each names the crate and the path that pulls it in. Revisit 2026-12-31, or
# when a pinned upstream bumps its dependency.
#
# Entries are pruned when the crate leaves the graph: `cargo deny check
# advisories` reports an ignore that is not encountered, and a stale ignore is
# a claim about a dependency that is no longer there.
ignore = [
    # gpui Linux accessibility stack: accesskit_unix -> zbus (Linux-only, inside
    # the pinned gpui-pre 0.3.9 — revisit when the framework bumps accesskit_unix)
    "RUSTSEC-2026-0370", # zvariant - via accesskit_unix -> zbus
    "RUSTSEC-2026-0371", # zbus_names - via accesskit_unix -> zbus
    "RUSTSEC-2026-0372", # zvariant_derive - via accesskit_unix -> zbus
    # pinned by the gpui framework tree
    "RUSTSEC-2024-0384", # instant - via gpui-base
    "RUSTSEC-2024-0436", # paste - via gpui-component / pulp / metal
    "RUSTSEC-2025-0134", # rustls-pemfile - via gpui-pre-reqwest
    # font and text shaping stack: pinned by the vector-graphics tree and by
    # the font crates the text renderer resolves through
    "RUSTSEC-2026-0192", # ttf-parser - via fontdb / cosmic-text / resvg
    "RUSTSEC-2026-0206", # rustybuzz - via usvg / resvg
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
