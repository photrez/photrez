[package]
name = "photrez-render"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Photrez CPU compositing and the shape and text rasterizers behind it"
repository = "https://github.com/photrez/photrez"
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
photrez-document = { path = "../document" }
photrez-raster = { path = "../raster" }
tiny-skia = "0.11.4"
cosmic-text = "0.19.0"

[dev-dependencies]
# The golden proofs decode PNG references; no production path in this package
# reads an image file.
image = { version = "0.25", default-features = false, features = ["png"] }
