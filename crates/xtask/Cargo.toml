[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
rust-version.workspace = true

[lints]
workspace = true

# Scope today: `parity` (the Rust port of the frozen TS diff tooling, keeping
# the appearance comparison runnable without a JS toolchain) and `capture`
# (the product-side window-capture driver). Sibling automation such as
# `bump-version` and `bench-pixel` lands when its consumer does - not
# speculatively.
[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi"] }
