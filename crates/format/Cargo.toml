[package]
name = "photrez-format"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Photrez .ptz envelope, JSON writers and readers, and image payload codecs"
repository = "https://github.com/photrez/photrez"
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Keeps the shared `.ptz` test documents compiled in for a host that wants to
# reuse them. Off by default so the fixture text is not in the shipped library.
ptz-test-fixtures = []

[dependencies]
photrez-document = { path = "../document" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
