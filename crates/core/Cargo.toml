[package]
name = "photrez-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Core image editing engine for Photrez"
repository = "https://github.com/photrez/photrez"
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Compatibility surface for the frozen Tauri host. The standalone GPUI app
# intentionally leaves this off so raw registry access is unavailable there.
legacy-tauri = []
# Test-only fixtures for the `.ptz` writer round-trip. Off by default so the
# fixture JSON is not compiled into the shipped library. `photrez-desktop`
# enables it from its dev-dependencies only, which (workspace resolver "2")
# keeps it out of the app build while still letting `save_stream.rs`'s tests
# import the same fixtures the core tests use.
ptz-test-fixtures = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
uuid = { version = "1.7", features = ["v4", "js"] }
rayon = "1.12.0"
tiny-skia = "0.11.4"
cosmic-text = "0.19.0"
