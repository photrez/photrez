[package]
name = "photrez-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Core image editing engine for Photrez"
repository = "https://github.com/photrez/photrez"
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Compatibility surface for an external host that drives the engine through the
# raw process-global registry. No crate in this workspace enables it: the
# native application deliberately leaves it off so raw registry access is
# unavailable there, and the gated arms are exercised by the test build.
legacy-host = []
# Test-only fixtures for the `.ptz` writer round-trip. Off by default so the
# fixture JSON is not compiled into the shipped library; the core test build
# gets the same module through `cfg(any(test, feature = ...))`, so a host that
# wants to reuse the fixtures enables this explicitly.
ptz-test-fixtures = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
uuid = { version = "1.7", features = ["v4", "js"] }
rayon = "1.12.0"
tiny-skia = "0.11.4"
cosmic-text = "0.19.0"
