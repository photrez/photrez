[package]
name = "rust-decode-bench"
version = "0.1.0"
edition = "2021"

# standalone: opt OUT of the repo root workspace. Cargo ignores a `[profile.*]`
# table in a member manifest ("profiles for the non root package will be
# ignored, specify profiles at the workspace root"), so this empty `[workspace]`
# is what keeps the release tuning below in force.
[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zune-core = "0.5"
zune-png = "0.5"
zune-jpeg = "0.5"

[profile.release]
lto = true
codegen-units = 1
