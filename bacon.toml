# Fast error feedback while the app keeps running: `bacon` checks just the app
# crate, so a save shows diagnostics in ~6 s (warm) instead of one build
# (~20 s). Type errors surface here; runtime and UI behaviour still need a build.
#
# Run it from a shell whose PATH starts with the MSYS2 MinGW `bin` directory,
# otherwise a gpui-pre rebuild fails in windres. `cargo xtask dev` sets that
# PATH for its child already.
default_job = "check"

[jobs.check]
command = ["cargo", "check", "-p", "photrez", "--color", "always"]
need_stdout = false
